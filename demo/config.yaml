# Demo configuration — no cluster, no GPUs, no risk.
#
# The Slurm side is a fake `squeue` on PATH emitting the real pipe-delimited
# format, so the parser exercised here is the production one. It prints start
# times in local time, as real squeue does, so the time-zone handling is
# exercised too. The GPU side is the simulator playing a "hung" fleet: memory
# held, processes resident, zero compute.

mode: observe          # never anything else in the demo
interval: 2s           # fast so the escalation is visible in seconds
metrics_addr: ":9835"
log_format: text

slurm:
  source: squeue

gpu:
  source: simulator
  simulator:
    gpus: 8
    scenario: hung     # try: healthy | idle | hung | starved | flaky | unreadable
    seed: 1

# Compressed from the production defaults (window 20m, gap 3m, interval 2m).
# The first alert needs a covered window: about window - max_sample_gap after
# start, i.e. the 4th cycle here. A single cycle is never enough.
thresholds:
  util_pct: 15
  mem_held_fraction: 0.05
  idle_power_watts: 60
  window: 10s
  warmup: 1m           # jobs in the fake squeue are hours old, so this passes
  min_samples: 3
  max_sample_gap: 5s

# Drain needs a previous alert cycle and at least one window of dwell.
stages:
  - after: 0s
    verdict: alert
  - after: 10s
    verdict: drain

exemptions:
  # carol's eval sweeps are known-bursty; exempting her proves the path works.
  users: [carol]

slack:
  webhook_env: SLACK_WEBHOOK_URL
  min_verdict: alert

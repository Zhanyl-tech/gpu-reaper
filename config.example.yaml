# Example production configuration. See README.md for every field.
#
# Start in observe mode. Watch gpu_reaper_findings for a week before you
# consider enforcement.

mode: observe          # never anything else in the demo
interval: 2m
metrics_addr: ":9835"
log_format: text

slurm:
  source: squeue

gpu:
  source: nvidia-smi
  simulator:
    gpus: 8
    scenario: hung     # try: healthy | idle | hung | starved | flaky
    seed: 1

thresholds:
  util_pct: 15
  mem_held_fraction: 0.05
  idle_power_watts: 60
  window: 20m
  warmup: 15m
  min_samples: 8
  max_sample_gap: 3m

# Escalate quickly so the ladder is observable. Production defaults are
# alert at 0 and drain at 60m.
stages:
  - after: 0s
    verdict: alert
  - after: 30s
    verdict: drain

exemptions:
  # carol's eval sweeps are known-bursty; exempting her proves the path works.
  users: [carol]

slack:
  webhook_env: SLACK_WEBHOOK_URL
  min_verdict: alert
